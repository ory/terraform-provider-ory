name: Acceptance Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all tests'
        required: false
        default: true
        type: boolean
      enable_keto_tests:
        description: 'Keto/relationship tests'
        required: false
        default: false
        type: boolean
      enable_b2b_tests:
        description: 'B2B/organization tests'
        required: false
        default: false
        type: boolean
      enable_social_provider_tests:
        description: 'Social provider tests'
        required: false
        default: false
        type: boolean
      enable_schema_tests:
        description: 'Identity schema tests'
        required: false
        default: false
        type: boolean
      enable_project_tests:
        description: 'Project create/delete tests'
        required: false
        default: false
        type: boolean
      enable_event_stream_tests:
        description: 'Event stream tests (requires Enterprise plan)'
        required: false
        default: false
        type: boolean
      enable_custom_domain_tests:
        description: 'Custom domain tests (requires hostname with CNAME)'
        required: false
        default: false
        type: boolean

concurrency:
  group: acceptance-tests
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      source-changed: ${{ steps.filter.outputs.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            source:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/acceptance-test.yml'
              - '.github/workflows/run-acceptance-tests.yml'

  acceptance-test:
    name: Build & Acceptance Test
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.source-changed == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/run-acceptance-tests.yml
    with:
      enable_keto_tests: ${{ github.event_name == 'pull_request' || github.event.inputs.run_all == 'true' || github.event.inputs.enable_keto_tests == 'true' }}
      enable_b2b_tests: ${{ github.event_name == 'pull_request' || github.event.inputs.run_all == 'true' || github.event.inputs.enable_b2b_tests == 'true' }}
      enable_social_provider_tests: ${{ github.event_name == 'pull_request' || github.event.inputs.run_all == 'true' || github.event.inputs.enable_social_provider_tests == 'true' }}
      enable_schema_tests: ${{ github.event_name == 'pull_request' || github.event.inputs.run_all == 'true' || github.event.inputs.enable_schema_tests == 'true' }}
      enable_project_tests: ${{ github.event_name == 'pull_request' || github.event.inputs.run_all == 'true' || github.event.inputs.enable_project_tests == 'true' }}
      enable_event_stream_tests: ${{ github.event_name == 'pull_request' || github.event.inputs.run_all == 'true' || github.event.inputs.enable_event_stream_tests == 'true' }}
      enable_custom_domain_tests: ${{ github.event_name == 'pull_request' || github.event.inputs.run_all == 'true' || github.event.inputs.enable_custom_domain_tests == 'true' }}
    secrets: inherit
