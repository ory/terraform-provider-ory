name: Scheduled Smoke Tests

on:
  schedule:
    - cron: '30 7 * * 1-5' # weekdays at 07:30 UTC
  workflow_dispatch: # allow manual trigger

concurrency:
  group: scheduled-smoke-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke Tests
    uses: ./.github/workflows/run-acceptance-tests.yml
    with:
      enable_keto_tests: true
      enable_b2b_tests: true
      enable_social_provider_tests: true
      enable_schema_tests: false
      enable_project_tests: false
      enable_event_stream_tests: true
      enable_custom_domain_tests: true
      enable_auto_link_tests: true
    secrets: inherit
