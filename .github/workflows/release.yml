name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  acceptance-tests:
    name: Pre-release Acceptance Tests
    permissions:
      contents: read
    uses: ./.github/workflows/run-acceptance-tests.yml
    with:
      enable_keto_tests: true
      enable_b2b_tests: true
      enable_social_provider_tests: true
      enable_schema_tests: true
      enable_project_tests: true
      enable_event_stream_tests: true
      enable_custom_domain_tests: true
    secrets: inherit

  goreleaser:
    name: GoReleaser
    needs: acceptance-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
