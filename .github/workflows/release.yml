name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  acceptance-tests:
    name: Pre-release Acceptance Tests
    uses: ./.github/workflows/run-acceptance-tests.yml
    with:
      enable_keto_tests: true
      enable_b2b_tests: true
      enable_social_provider_tests: true
      enable_schema_tests: true
      enable_project_tests: true
      enable_event_stream_tests: true
      enable_custom_domain_tests: true
    secrets: inherit

  goreleaser:
    name: GoReleaser
    needs: acceptance-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
