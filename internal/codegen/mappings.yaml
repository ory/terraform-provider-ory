  - name: oauth2_session_encrypt_at_rest
    go_field: OAuth2SessionEncryptAtRest
    type: bool
    patch_path: /services/oauth2/config/oauth2/session/encrypt_at_rest
    description: "Encrypt OAuth2 sessions at rest."

  - name: oauth2_serve_cookies_same_site_legacy_workaround
    go_field: OAuth2ServeCookiesSameSiteLegacyWorkaround
    type: bool
    patch_path: /services/oauth2/config/serve/cookies/same_site_legacy_workaround
    description: >-
      Enable the SameSite=None legacy workaround for OAuth2 cookies.
      When enabled, a fallback cookie without SameSite is set alongside the main cookie
      for clients that don't support SameSite=None.
    deprecated_name: oauth2_cookies_same_site_legacy_workaround
    deprecated_go_field: OAuth2CookiesSameSiteLegacyWorkaround

  # ============================================================================
