  - name: oauth2_urls_error
    go_field: OAuth2URLsError
    type: string
    patch_path: /services/oauth2/config/urls/error
    description: "OAuth2 error endpoint URL."
    deprecated_name: oauth2_error_url
    deprecated_go_field: OAuth2ErrorURL

  - name: oauth2_urls_self_issuer
