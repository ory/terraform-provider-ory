# Project Config Attribute Mappings
#
# This file defines all simple (string, bool, int64) attributes for the
# ory_project_config resource. The codegen tool reads this file and generates:
#   - schema_gen.go   (Terraform schema attributes)
#   - patches_gen.go  (JSON Patch mapping tables)
#   - read_gen.go     (API response -> state read mapping tables)
#
# Complex types (nested objects, lists of objects, CORS structs) are handled
# in hand-written *_custom.go files and are NOT included here.
#
# To add a new simple config field:
#   1. Add an entry below with name, type, patch_path, and description
#   2. Run: make generate
#   3. The new field will appear in schema, patches, and read logic automatically
#
# OpenAPI "governs" pattern support:
#   If the OpenAPI spec has a "governs" description for a property, you can
#   use openapi_property instead of patch_path. The codegen tool will derive
#   the patch path automatically from the spec when run with --spec:
#
#     - name: session_lifespan
#       go_field: SessionLifespan
#       type: string
#       openapi_property: kratos_session_lifespan  # patch_path derived from spec
#       description: "Session duration."
#
#   If both openapi_property and patch_path are set, patch_path takes precedence
#   and a warning is shown if they don't match. This allows gradual migration
#   from explicit paths to spec-derived paths.

attributes:
  # ============================================================================
  # Session (identity service)
  # ============================================================================
  - name: session_lifespan
    go_field: SessionLifespan
    type: string
    openapi_property: kratos_session_lifespan
    description: "Session duration (e.g., '24h0m0s')."

  - name: session_cookie_same_site
    go_field: SessionCookieSameSite
    type: string
    openapi_property: kratos_session_cookie_same_site
    description: "SameSite cookie attribute (Lax, Strict, None)."

  - name: session_cookie_persistent
    go_field: SessionCookiePersistent
    type: bool
    openapi_property: kratos_session_cookie_persistent
    description: "Enable persistent session cookies (survive browser close)."

  - name: session_whoami_required_aal
    go_field: SessionWhoamiRequiredAAL
    type: string
    patch_path: /services/identity/config/session/whoami/required_aal
    description: "Required AAL for session whoami endpoint: 'aal1', 'aal2', or 'highest_available'."

  # ============================================================================
  # OAuth2/Hydra Token Lifespans
  # ============================================================================
  - name: oauth2_ttl_access_token
    go_field: OAuth2TTLAccessToken
    type: string
    patch_path: /services/oauth2/config/ttl/access_token
    description: "OAuth2 access token lifespan (e.g., '1h', '30m'). Requires Hydra service."
    deprecated_name: oauth2_access_token_lifespan
    deprecated_go_field: OAuth2AccessTokenLifespan

  - name: oauth2_ttl_refresh_token
    go_field: OAuth2TTLRefreshToken
    type: string
    patch_path: /services/oauth2/config/ttl/refresh_token
    description: "OAuth2 refresh token lifespan (e.g., '720h' for 30 days). Requires Hydra service."
    deprecated_name: oauth2_refresh_token_lifespan
    deprecated_go_field: OAuth2RefreshTokenLifespan

  - name: oauth2_ttl_auth_code
    go_field: OAuth2TTLAuthCode
    type: string
    patch_path: /services/oauth2/config/ttl/auth_code
    description: "OAuth2 authorization code lifespan (e.g., '30m'). Requires Hydra service."
    deprecated_name: oauth2_auth_code_lifespan
    deprecated_go_field: OAuth2AuthCodeLifespan

  - name: oauth2_ttl_id_token
    go_field: OAuth2TTLIDToken
    type: string
    patch_path: /services/oauth2/config/ttl/id_token
    description: "OAuth2 ID token lifespan (e.g., '1h'). Requires Hydra service."
    deprecated_name: oauth2_id_token_lifespan
    deprecated_go_field: OAuth2IDTokenLifespan

  - name: oauth2_ttl_login_consent_request
    go_field: OAuth2TTLLoginConsentRequest
    type: string
    patch_path: /services/oauth2/config/ttl/login_consent_request
    description: "OAuth2 login/consent request lifespan (e.g., '30m'). Requires Hydra service."
    deprecated_name: oauth2_login_consent_request_lifespan
    deprecated_go_field: OAuth2LoginConsentRequestLifespan

  # ============================================================================
  # OAuth2/Hydra Boolean Settings
  # ============================================================================
  - name: oauth2_mirror_top_level_claims
    go_field: OAuth2MirrorTopLevelClaims
    type: bool
    patch_path: /services/oauth2/config/oauth2/mirror_top_level_claims
