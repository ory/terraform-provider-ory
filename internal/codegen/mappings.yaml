    type: string
    patch_path: /services/oauth2/config/urls/login
    description: "OAuth2 login endpoint URL."
    deprecated_name: oauth2_login_url
    deprecated_go_field: OAuth2LoginURL

  - name: oauth2_urls_logout
    go_field: OAuth2URLsLogout
    type: string
    patch_path: /services/oauth2/config/urls/logout
    description: "OAuth2 logout endpoint URL."
